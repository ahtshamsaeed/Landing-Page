<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Landing Page</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap-5.3.9-dist/css/bootstrap.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header Start -->
    <header class="container-fluid py-2 shadow-lg position-sticky top-0 bg-white">
        <div class="container">
            <div class="row align-items-center">

                <!-- Logo -->
                <figure class="col-lg-6 col-12 text-lg-start text-center mb-0">
                    <img src="images/logo.svg" alt="Logo" class="img-fluid">
                </figure>

                <!-- Header Buttons -->
                <div class="col-lg-6 col-12 mt-2 mt-lg-0">
                    <div class="btn-outer d-flex gap-3 justify-content-lg-end justify-content-center align-items-center">

                        <button type="button" class="btn whatsappbtn">
                            <i class="fa-brands fa-whatsapp"></i>
                            Chat With Us
                        </button>

                        <button type="button" class="btn call">
                            <i class="fa-solid fa-phone"></i>
                            Call Us
                        </button>

                    </div>
                </div>

            </div>
        </div>
    </header>
    <!-- Header End -->


    <!-- Banner Section Start -->
    <section class="container-fluid py-lg-5 py-sm-4 py-3">
        <div class="container">
            <div class="row justify-content-between align-items-center">

                <!-- Banner Content -->
                <div class="col-lg-6 col-12">
                    <div class="bannercontent">
                        <h1>
                            Career Opportunities <br>
                            in <span>Digital Marketing</span>
                        </h1>
                        <p>
                            Digital marketing course so good,
                            you only pay-after-placement.
                        </p>

                        <ul class="m-0 p-0">
                            <li class="mb-3"><i class="fa-solid fa-circle-check"></i> Specialization: Performance Marketing</li>
                            <li class="mb-3"><i class="fa-solid fa-circle-check"></i> Min salary of Rs 4.5 LPA</li>
                            <li class="mb-3"><i class="fa-solid fa-circle-check"></i> 50 seats only</li>
                        </ul>

                        <div class="bannercontentBtn d-flex gap-3">
                            <button type="button">Book 2 Days Demo</button>
                            <button type="button"><i class="fa-solid fa-download"></i> Download Curriculum</button>
                        </div>
                    </div>
                </div>

                <!-- Right Side Column -->
                <div class="col-lg-5 col-12">
                <form action="" class="bannerform shadow-lg"></form>
                </div>

            </div>
        </div>
    </section>
    <!-- Banner Section End -->


    <!-- Bootstrap JavaScript -->
    <script src="bootstrap-5.3.9-dist/js/bootstrap.bundle.js"></script>

</body>

</html>
